<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a73e8">
    <meta name="description" content="可語音輸入、三層任務、拖曳排序與時間記錄的每日工作記錄表。">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="工作記錄">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <title>每日工作記錄表 v2.10.0</title>
    <script src="sortable.min.js"></script><!-- SortableJS 1.15.6（MIT），放在本機，離線也能拖曳 -->
    <style>
        /* Hallmark v2.0.0 (condensed) | shape: app screen | screen: daily task list with progress and the report | signature: the day's task card with its progress tag | tokens: generated from the existing palette, neutrals tinted to the work-log blue, with a dark scheme | type: system sans, one family */
        /* critique: Google greys and emoji icons read as a stock template; one blue family, line icons, light and dark */
        /* Hallmark · waive 24b · paddings of 2, 6, 10 and 14px in the task rows and progress tags · the owner logs many short work items a day and keeps this compact task list rhythm */
        :root {
            color-scheme: light dark;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', Helvetica, Arial, sans-serif;
            --c-f5f7f8: #f5f7f9;
            --c-5f6368: #606367;
            --c-e8eaed: #e7eaef;
            --c-ffffff: #fbfcff;
            --c-000000-14: rgba(0,0,0,0.14);
            --c-3c4043: #3d3f44;
            --c-9aa0a6: #9c9fa4;
            --c-e0e3e6: #e0e3e8;
            --c-a8adb2: #aaacb2;
            --c-1a73e8-12: rgba(26,115,232,0.12);
            --c-dadce0: #d9dce1;
            --c-4285f4: #4285f4;
            --c-d93025: #d93025;
            --c-000000-5: rgba(0,0,0,0.05);
            --c-b0b5ba: #b2b4ba;
            --c-d5d9dd: #d6d9de;
            --c-f1f3f4: #f1f3f5;
            --c-188038: #188038;
            --c-e6f4ea: #e6f4ea;
            --c-e06055: #e06055;
            --c-fff8e1: #fff8e1;
            --c-fde7a9: #fde7a9;
            --c-7a5b00: #7a5b00;
            --c-202124-92: rgba(31,33,37,0.92);
            --c-000000-45: rgba(0,0,0,0.45);
            --c-000000-15: rgba(0,0,0,0.15);
            --c-80868b: #82858a;
            --c-dddddd: #dadde3;
            --c-d93025-45: rgba(217,48,37,0.45);
            --c-d93025-0: rgba(217,48,37,0.0);
            --c-f7f9fb: #f7f9fc;
            --c-0b57d0: #0b57d0;
            --c-eef0f2: #eef0f3;
            --c-b06000: #b06000;
            --c-323639: #33353a;
            --c-000000-25: rgba(0,0,0,0.25);
            --c-8ab4f8: #8ab4f8;
            --c-1a73e8: #1a73e8;
            --c-e8f0fe: #e8f0fe;
            --c-d2e3fc: #d2e3fc;
            --c-8a9096: #8d8f94;
            --c-2b2f33: #2c2f33;
            --c-f9ab00: #f9ab00;
            --c-137333: #137333;
            --blue: var(--c-1a73e8); --blue-light: var(--c-e8f0fe); --blue-line: var(--c-d2e3fc); --sub: var(--c-3c4043); --line: var(--c-eef0f2); --muted: var(--c-8a9096); --text: var(--c-2b2f33);
            --star: var(--c-f9ab00); --ok: var(--c-137333); --bad: var(--c-d93025); --warn: var(--c-b06000); --ai: var(--c-1a73e8);
        }
        @media (prefers-color-scheme: dark) {
            :root {
            --c-f5f7f8: #121419;
            --c-5f6368: #babec6;
            --c-e8eaed: #1a1c21;
            --c-ffffff: #0d0f14;
            --c-000000-14: rgba(0,0,0,0.22);
            --c-3c4043: #c6cbd3;
            --c-9aa0a6: #9498a0;
            --c-e0e3e6: #1e2126;
            --c-a8adb2: #9498a0;
            --c-1a73e8-12: rgba(120,173,249,0.12);
            --c-dadce0: #23252a;
            --c-4285f4: #5f9bff;
            --c-d93025: #ff7e6d;
            --c-000000-5: rgba(0,0,0,0.08);
            --c-b0b5ba: #9498a0;
            --c-d5d9dd: #25282c;
            --c-f1f3f4: #14171b;
            --c-188038: #71cf83;
            --c-e6f4ea: #131b15;
            --c-e06055: #eb6c60;
            --c-fff8e1: #171306;
            --c-fde7a9: #241c05;
            --c-7a5b00: #debc72;
            --c-202124-92: rgba(207,212,220,0.92);
            --c-000000-45: rgba(0,0,0,0.6);
            --c-000000-15: rgba(0,0,0,0.24);
            --c-80868b: #9ca1a8;
            --c-dddddd: #222529;
            --c-d93025-45: rgba(255,126,109,0.45);
            --c-d93025-0: rgba(255,126,109,0.0);
            --c-f7f9fb: #111318;
            --c-0b57d0: #9bc0fe;
            --c-eef0f2: #16191d;
            --c-b06000: #ea954c;
            --c-323639: #c9cdd5;
            --c-000000-25: rgba(0,0,0,0.4);
            --c-8ab4f8: #7099db;
            --c-1a73e8: #78adf9;
            --c-e8f0fe: #151921;
            --c-d2e3fc: #182231;
            --c-8a9096: #9498a0;
            --c-2b2f33: #cbcfd7;
            --c-f9ab00: #c78b1c;
            --c-137333: #82d892;
            }
        }

        * { box-sizing: border-box; }
        
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body {
            font-family: var(--font);
            max-width: 680px; margin: 0 auto; padding: 0 10px 64px 10px;
            background-color: var(--c-f5f7f8); color: var(--text); -webkit-tap-highlight-color: transparent;
            font-size: 13px;
        }
        svg.ic { width: 16px; height: 16px; display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

        /* ---- 頂部列（固定） ---- */
        .sticky-top-bar { position: sticky; top: 0; z-index: 100; background-color: var(--c-f5f7f8); padding-top: 8px; padding-bottom: 8px; }
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .header-container h2 { margin: 0; color: var(--blue); font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px;  }
        .version-tag { font-size: 9px; background: var(--blue-light); color: var(--blue); padding: 1px 4px; border-radius: 3px; font-weight: 600; letter-spacing: 0; }
        .today-stat { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 2px; }

        .menu-wrapper { position: relative; }
        .three-dots-btn { background: transparent; border: none; border-radius: 50%; width: 30px; height: 30px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--c-5f6368); }
        .three-dots-btn:active, .three-dots-btn:hover { background: var(--c-e8eaed); }
        .dropdown-menu { display: none; position: absolute; right: 0; top: 34px; background: var(--c-ffffff); border-radius: 10px; box-shadow: 0 6px 20px var(--c-000000-14); width: 228px; padding: 4px 0; z-index: 200; }
        .dropdown-menu.show { display: block; }
        .dropdown-item { padding: 9px 14px; font-size: 13px; color: var(--c-3c4043); cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .dropdown-item:active, .dropdown-item:hover { background-color: var(--blue-light); color: var(--blue); }
        .dropdown-divider { height: 1px; background: var(--line); margin: 4px 0; }
        .dropdown-label { font-size: 10.5px; color: var(--c-9aa0a6); padding: 6px 14px 2px; }
        .dropdown-menu { max-height: calc(100vh - 60px); overflow-y: auto; }

        .input-group { display: flex; gap: 6px; align-items: center; }
        input[type="text"] { flex: 1; min-width: 0; height: 34px; padding: 0 12px; border: 1px solid var(--c-e0e3e6); border-radius: 17px; font-size: 13.5px; background: var(--c-ffffff); outline: none; color: var(--text); }
        input[type="text"]::placeholder { color: var(--c-a8adb2); }
        input[type="text"]:focus { box-shadow: 0 0 0 2px var(--c-1a73e8-12); }
        .btn-primary { height: 34px; padding: 0 14px; background-color: var(--blue); color: var(--c-ffffff); border: none; border-radius: 17px; cursor: pointer; font-weight: 600; font-size: 13px; flex-shrink: 0; }
        .btn-add-main { width: 34px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .btn-add-main svg.ic { width: 17px; height: 17px; stroke-width: 2.4; }
        .btn-outline { padding: 7px 14px; background: transparent; border: 1px solid var(--c-dadce0); border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text); }
        .btn-voice { width: 34px; height: 34px; padding: 0; background-color: var(--c-ffffff); color: var(--c-4285f4); border: 1px solid var(--c-e0e3e6); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .btn-voice svg.ic { width: 17px; height: 17px; }
        .btn-voice.listening { background-color: var(--c-d93025); border-color: var(--c-d93025); color: var(--c-ffffff); animation: blink 1s infinite; }
        #voiceStatus { width: 100%; font-size: 11.5px; color: var(--c-d93025); margin-top: 4px; display: none; }

        /* ---- 卡片與列 ---- */
        .task-card { color: var(--text); background: var(--c-ffffff); border-radius: 10px; box-shadow: 0 1px 2px var(--c-000000-5); margin-bottom: 8px; padding: 2px 6px 4px 2px; }
        .task-row { display: flex; align-items: center; gap: 3px; padding: 3px 0; background: var(--c-ffffff); min-height: 30px; }
        .main-row { padding: 5px 0; }

        .subtask-container { margin-left: 12px; border-left: 1.5px solid var(--blue-line); padding-left: 1px; min-height: 2px; }
        .grandtask-container { margin-left: 28px; border-left: 1.5px dotted var(--c-dadce0); padding-left: 0; min-height: 0; }
        .subtask-container:empty { border-left-color: transparent; }
        .subtask-item { background: var(--c-ffffff); }
        .subtask-item + .subtask-item { border-top: 1px solid var(--line); }
        .collapsed { display: none !important; }

        .toggle-icon { cursor: pointer; font-size: 8px; color: var(--c-b0b5ba); width: 14px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; user-select: none; }
        .toggle-icon:hover { color: var(--blue); }
        .toggle-placeholder { width: 14px; flex-shrink: 0; }
        .drag-handle { cursor: grab; font-size: 10px; color: var(--c-d5d9dd); width: 12px; text-align: center; touch-action: none; flex-shrink: 0; user-select: none; }
        .drag-handle:active { cursor: grabbing; color: var(--blue); }
        input[type="checkbox"] { width: 15px; height: 15px; margin: 0 3px 0 1px; cursor: pointer; accent-color: var(--blue); flex-shrink: 0; }

        input[type="checkbox"].locked { opacity: 0.35; }
        .main-task-text { font-size: 14px; font-weight: 700; color: var(--blue); }
        .sub-task-text { font-size: 13.5px; font-weight: 600; color: var(--sub); }
        .grand-task-text { font-size: 12.5px; font-weight: 400; color: var(--text); line-height: 1.45; }
        .task-text { flex: 1; min-width: 0; word-break: break-word; line-height: 1.35; cursor: pointer; padding: 1px 2px; }
        .completed { text-decoration: line-through; color: var(--c-a8adb2) !important; font-weight: normal !important; }
        .progress-tag { display: inline-block; font-size: 10px; font-weight: 500; color: var(--muted); background: var(--c-f1f3f4); padding: 0 6px; border-radius: 8px; margin-left: 4px; vertical-align: 1px; text-decoration: none; }
        .progress-tag.done { color: var(--c-188038); background: var(--c-e6f4ea); }

        /* ---- 右側小按鈕 ---- */
        .row-actions { display: flex; align-items: center; gap: 0; flex-shrink: 0; }
        .action-btn { background: transparent; border: none; cursor: pointer; width: 26px; height: 26px; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--c-9aa0a6); }
        .action-btn:active, .action-btn:hover { background: var(--blue-light); color: var(--blue); }
        .btn-add-sub { color: var(--blue); background: var(--blue-light); width: 24px; height: 24px; margin-left: 2px; }
        .btn-add-sub svg.ic { width: 14px; height: 14px; stroke-width: 2.2; }
        .btn-add-sub.small { width: 22px; height: 22px; background: transparent; border: 1px solid var(--blue-line); }
        .btn-add-sub.small svg.ic { width: 12px; height: 12px; }
        .btn-delete { color: var(--c-e06055); }

        .btn-edit, .btn-delete { display: none !important; }
        body.edit-mode .btn-edit, body.edit-mode .btn-delete { display: flex !important; }
        body.edit-mode .task-card { box-shadow: 0 0 0 1px var(--blue-line); }
        body.hide-completed .completed-card, body.hide-completed .completed-sub, body.hide-completed .completed-grand { display: none !important; }

        .time-badge { display: none; font-size: 9.5px; color: var(--muted); font-weight: 400; margin-top: 1px; white-space: nowrap; }
        body.show-time .time-badge { display: inline-block !important; width: 100%; text-decoration: none; }

        /* ---- 備份提醒 ---- */
        .backup-banner { display: none; align-items: center; gap: 6px; margin-top: 8px; padding: 6px 8px 6px 12px; background: var(--c-fff8e1); border: 1px solid var(--c-fde7a9); border-radius: 10px; font-size: 12px; color: var(--c-7a5b00); }
        .backup-banner.show { display: flex; }
        .backup-banner span { flex: 1; min-width: 0; }
        .bb-btn { border: none; background: transparent; color: var(--c-7a5b00); font-size: 12px; padding: 5px 8px; border-radius: 12px; cursor: pointer; flex-shrink: 0; }
        .bb-btn.primary { background: var(--blue); color: var(--c-ffffff); font-weight: 600; }

        /* ---- 編輯模式提示列 ---- */
        .edit-bar { display: none; align-items: center; justify-content: space-between; margin-top: 8px; padding: 5px 8px 5px 12px; background: var(--blue-light); border-radius: 10px; font-size: 12px; color: var(--blue); }
        body.edit-mode .edit-bar { display: flex; }

        .toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); background: var(--c-202124-92); color: var(--c-ffffff); font-size: 12.5px; padding: 8px 14px; border-radius: 18px; z-index: 2000; opacity: 0; transition: opacity 0.25s; pointer-events: none; max-width: 90%; text-align: center; white-space: pre-line; }
        .toast.show { opacity: 1; }
        .empty-hint { text-align: center; color: var(--muted); font-size: 12.5px; padding: 40px 0; line-height: 1.7; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--c-000000-45); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--c-ffffff); padding: 14px; border-radius: 12px; width: 92%; max-width: 500px; box-shadow: 0 4px 12px var(--c-000000-15); }
        .modal-content h3 { margin: 0 0 4px 0; font-size: 15px; }
        .modal-hint { font-size: 12px; color: var(--c-80868b); line-height: 1.5; }
        .modal-content textarea { width: 100%; height: 150px; margin: 8px 0; padding: 8px; border: 1px solid var(--c-dddddd); border-radius: 6px; font-family: monospace; font-size: 11px; }
        /* ---- 新增次任務 / 孫任務：語音聆聽視窗 ---- */
        .listen-modal { max-width: 320px; text-align: center; padding: 16px 14px 14px; }
        .lm-title { font-size: 13px; color: var(--muted); }
        .lm-parent { font-size: 14px; font-weight: 600; color: var(--sub); margin-top: 2px; word-break: break-word; }
        .lm-mic { width: 64px; height: 64px; margin: 16px auto 8px; border-radius: 50%; border: none; background: var(--c-d93025); color: var(--c-ffffff); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 0 0 var(--c-d93025-45); animation: pulse 1.4s infinite; }
        .lm-mic svg.ic { width: 28px; height: 28px; }
        .lm-status { font-size: 12.5px; color: var(--c-d93025); min-height: 18px; }
        .lm-actions { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--c-d93025-45); } 70% { box-shadow: 0 0 0 14px var(--c-d93025-0); } 100% { box-shadow: 0 0 0 0 var(--c-d93025-0); } }

        /* ---- 總覽報表 ---- */
        .report-overlay { display: none; position: fixed; inset: 0; background: var(--c-000000-45); z-index: 1100; justify-content: center; align-items: flex-end; }
        .report-sheet { background: var(--c-f5f7f8); width: 100%; max-width: 680px; max-height: 92vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 0 12px 20px; -webkit-overflow-scrolling: touch; }
        @media (min-width: 600px) { .report-overlay { align-items: center; } .report-sheet { border-radius: 16px; } }
        .rp-head { position: sticky; top: 0; background: var(--c-f5f7f8); display: flex; align-items: center; justify-content: space-between; padding: 12px 0 8px; z-index: 2; }
        .rp-head h3 { margin: 0; font-size: 16px; color: var(--blue); }
        .rp-head small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 1px; }
        .rp-close { background: none; border: none; font-size: 22px; color: var(--c-80868b); width: 34px; height: 34px; cursor: pointer; border-radius: 50%; }
        .rp-close:hover { background: var(--c-e8eaed); }
        .rp-card { color: var(--text); background: var(--c-ffffff); border-radius: 12px; padding: 12px; margin-bottom: 10px; box-shadow: 0 1px 2px var(--c-000000-5); }
        .rp-card h4 { margin: 0 0 8px; font-size: 13px; color: var(--sub); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .rp-card h4 small { font-weight: 400; color: var(--muted); font-size: 11px; }
        .rp-hero { display: flex; align-items: center; gap: 14px; }
        .rp-ring { width: 76px; height: 76px; flex-shrink: 0; }
        .rp-hero-num { font-size: 28px; font-weight: 700; color: var(--text); line-height: 1; }
        .rp-hero-sub { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
        .rp-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
        .rp-tile { background: var(--c-f7f9fb); border-radius: 10px; padding: 8px 10px; }
        .rp-tile .lbl { font-size: 11px; color: var(--muted); }
        .rp-tile .val { font-size: 17px; font-weight: 700; color: var(--text); margin-top: 2px; }
        .rp-tile .val small { font-size: 11px; font-weight: 400; color: var(--muted); }
        .rp-mini { height: 4px; background: var(--c-e8eaed); border-radius: 2px; margin-top: 6px; overflow: hidden; }
        .rp-mini i { display: block; height: 100%; background: var(--blue); border-radius: 2px; }
        .rp-chart { position: relative; }
        .rp-chart svg { width: 100%; height: 130px; display: block; overflow: visible; }
        .rp-chart .bar { fill: var(--blue); }
        .rp-chart .bar.today { fill: var(--c-0b57d0); }
        .rp-chart .hit { fill: transparent; cursor: pointer; }
        .rp-chart .hit:hover + .bar, .rp-chart .bar.active { fill: var(--c-0b57d0); }
        .rp-chart text { font-size: 9.5px; fill: var(--muted); }
        .rp-chart text.v { fill: var(--sub); font-weight: 600; }
        .rp-chart .grid { stroke: var(--c-eef0f2); stroke-width: 1; }
        .rp-chart .base { stroke: var(--c-dadce0); stroke-width: 1; }
        .rp-chart-info { font-size: 12px; color: var(--sub); min-height: 18px; margin-top: 4px; text-align: center; }
        .rp-tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
        .rp-tools select { font-size: 12px; padding: 4px 6px; border: 1px solid var(--c-dadce0); border-radius: 8px; background: var(--c-ffffff); color: var(--text); }
        .rp-tools label { font-size: 12px; color: var(--sub); display: flex; align-items: center; gap: 4px; }
        .rp-tools label input { width: 14px; height: 14px; }
        .rp-row { padding: 8px 2px; border-top: 1px solid var(--line); cursor: pointer; }
        .rp-row:first-child { border-top: none; }
        .rp-row:active, .rp-row:hover { background: var(--c-f7f9fb); }
        .rp-row-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
        .rp-row-top b { font-weight: 600; color: var(--text); word-break: break-word; }
        .rp-row-top span { color: var(--sub); font-size: 12px; white-space: nowrap; }
        .rp-bar { height: 6px; background: var(--c-e8eaed); border-radius: 3px; margin: 5px 0 3px; overflow: hidden; }
        .rp-bar i { display: block; height: 100%; background: var(--blue); border-radius: 3px; }
        .rp-bar i.full { background: var(--c-188038); }
        .rp-row-meta { font-size: 11px; color: var(--muted); }
        .rp-done-tag { color: var(--c-188038); font-weight: 600; }
        .rp-old { display: flex; gap: 8px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line); font-size: 12.5px; cursor: pointer; }
        .rp-old:first-child { border-top: none; }
        .rp-old .days { flex-shrink: 0; min-width: 44px; font-weight: 700; color: var(--c-b06000); font-size: 12px; }
        .rp-old .txt { flex: 1; min-width: 0; word-break: break-word; color: var(--text); }
        .rp-old .path { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }
        .rp-empty { font-size: 12px; color: var(--muted); text-align: center; padding: 10px 0; }
        .rp-actions { display: flex; gap: 8px; justify-content: center; margin-top: 4px; }
        #textModal { z-index: 1200; }
        /* 拖曳時：空的次任務 / 孫任務區顯示成可放置的區域 */
        body.dragging .subtask-container:not(.collapsed):empty,
        body.dragging .grandtask-container:not(.collapsed):empty { min-height: 22px; border: 1.5px dashed var(--blue-line); border-radius: 6px; margin: 2px 4px 4px 28px; }
        body.dragging .subtask-container:not(.collapsed):empty { margin-left: 12px; }
        .sortable-ghost { opacity: 0.4; }
        .undo-bar { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(120px); background: var(--c-323639); color: var(--c-ffffff); font-size: 13px; padding: 6px 6px 6px 14px; border-radius: 22px; display: flex; align-items: center; gap: 10px; z-index: 2100; transition: transform 0.25s; max-width: 92%; box-shadow: 0 4px 14px var(--c-000000-25); }
        .undo-bar.show { transform: translateX(-50%) translateY(0); }
        .undo-bar span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .undo-bar button { background: transparent; border: none; color: var(--c-8ab4f8); font-weight: 700; font-size: 13px; padding: 6px 10px; border-radius: 14px; cursor: pointer; flex-shrink: 0; }
        .task-card.flash { animation: flash 1.6s ease; }
        @keyframes flash { 0%, 60% { box-shadow: 0 0 0 2px var(--blue); } 100% { box-shadow: 0 1px 2px var(--c-000000-5); } }

        @keyframes blink { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

        @media (min-width: 600px) {
            body { padding: 0 16px 64px 16px; font-size: 14px; }
            .header-container h2 { font-size: 17px; }
            .main-task-text { font-size: 15px; } .sub-task-text { font-size: 14.5px; } .grand-task-text { font-size: 13.5px; }
        }
    
        /* ---- Hallmark: icons, focus, states, motion ---- */
        html, body { overflow-x: clip; }
        svg.hi { width: 1.15em; height: 1.15em; display: inline-block; vertical-align: -0.2em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
        svg.hi.hi-grip { stroke-width: 3; }
        svg.hi.hi-star { color: var(--star); fill: var(--star); stroke: var(--star); }
        svg.hi.hi-ok { color: var(--ok); }
        svg.hi.hi-bad { color: var(--bad); }
        svg.hi.hi-warn { color: var(--warn); }
        svg.hi.hi-ai { color: var(--ai); }
        .dropdown-item i svg.hi, .tool-card i svg.hi { width: 20px; height: 20px; vertical-align: middle; }
        .ae-ic svg.hi { width: 22px; height: 22px; }
        .play-fab svg.hi, .cz-fab svg.hi { width: 22px; height: 22px; }
        .header-container .version-tag { margin-right: auto; margin-left: 6px; }
        .rp-hero-num { font-variant-numeric: tabular-nums; }
        .today-stat:not(:empty) { margin-left: 8px; font-weight: 400; }
        h1, h2, h3, .cz-title { text-wrap: balance; overflow-wrap: break-word; min-width: 0; }
        :where(button, a, [onclick], input, select, textarea, summary):focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; transition: none; }
        input[type="text"]:focus, .search-box input:focus { outline: 2px solid var(--blue); outline-offset: 0; }
        button:disabled, .btn-primary:disabled, .rec-btn:disabled { cursor: not-allowed; background: var(--line); color: var(--muted); opacity: 1; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
        }
</style>

    <div class="sticky-top-bar">
        <div class="header-container">
            <h2><svg class="hi " viewBox="0 0 24 24" aria-hidden="true"><use href="#hi-clipboard"/></svg> 每日工作記錄表<span class="today-stat" id="todayStat"></span></h2><span class="version-tag">v2.10.0</span>

                <button class="three-dots-btn" onclick="toggleDropdown(event)" title="更多">⋮</button>

                    <div class="dropdown-item" onclick="setAllCollapsed(false)"><svg class="hi " viewBox="0 0 24 24" aria-hidden="true"><use href="#hi-expand"/></svg> <span>全部展開</span></div>

            const RE = new RegExp('(' + Object.keys(MAP).sort((a, b) => b.length - a.length).map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')\uFE0F?', 'gu');
            const SKIP = new Set(['SCRIPT', 'STYLE', 'TEXTAREA', 'OPTION', 'TITLE', 'INPUT', 'SELECT']);
            const NS = 'http://www.w3.org/2000/svg';
            function icon(name) {
                const s = document.createElementNS(NS, 'svg');
                s.setAttribute('class', 'hi ' + (CLS[name] || ''));
                s.setAttribute('viewBox', '0 0 24 24');
                s.setAttribute('aria-hidden', 'true');
                const u = document.createElementNS(NS, 'use');
                u.setAttribute('href', '#hi-' + name);
                s.appendChild(u);
                return s;
            }
            function fixText(t) {
                const p = t.parentNode;
                if (!p || SKIP.has(p.nodeName) || p.isContentEditable) return;
                const v = t.nodeValue;
                RE.lastIndex = 0;
                if (!RE.test(v)) return;
                RE.lastIndex = 0;
                const frag = document.createDocumentFragment();
                let last = 0, m;
                while ((m = RE.exec(v))) {
                    if (m.index > last) frag.appendChild(document.createTextNode(v.slice(last, m.index)));
                    frag.appendChild(icon(MAP[m[1]]));
                    last = m.index + m[0].length;

                if (last < v.length) frag.appendChild(document.createTextNode(v.slice(last)));

                if (root.nodeType !== 1 || SKIP.has(root.nodeName)) return;

            edit:  '<svg aria-hidden="true" class="ic" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>',

        // ---- 資料讀取（沿用 v1.8 的儲存位置，舊資料不會遺失） ----

        // 補齊資料結構，舊版資料（沒有時間、沒有孫任務）也能正常顯示
        function normalizeTasks(list) {
            return list.filter(t => t && typeof t === 'object').map(t => {
                t.text = String(t.text ?? '');
                t.subtasks = Array.isArray(t.subtasks) ? t.subtasks : [];
                if (!t.createdAt) t.createdAt = typeof t.id === 'number' ? t.id : Date.now();
                t.subtasks = t.subtasks.filter(s => s && typeof s === 'object');

        (function dedupeIds() {

        function findSub(mainId, subId) { const m = findMain(mainId); return m ? m.subtasks.find(s => s.id === subId) : null; }

        // 一次性語音辨識（次任務 / 孫任務用），回傳 Promise
        let activeRec = null;
        function listenOnce(lang = 'zh-TW') {
            return new Promise((resolve, reject) => {

                let done = false;
                // 先綁定事件再 start；沒說話就結束時也要結束 Promise

        // ---- 子項目全部完成 → 上層自動完成 ----
        // 規則（v2.9）：
        //  1. 孫任務全部打勾 → 次任務自動打勾；次任務全部打勾 → 主任務自動打勾（會一路往上連動）
        //  2. 只要有任何子任務未完成（取消打勾、新增子任務），上層就自動恢復成未完成
        //  3. 有未完成子任務時，上層不能手動打勾（見 toggleCheck）
        //  4. 子任務全部完成時，上層仍可手動取消打勾（標記 reopened），會保持未完成；
        //     之後只要它底下的子任務有變動（打勾、新增、刪除、拖進拖出），就恢復自動判斷
        function autoStatus(parent, children) {
            if (!children || children.length === 0) return null;
            const allDone = children.every(c => c.checked);
            if (allDone && !parent.checked && !parent.reopened) {
                parent.checked = true; parent.autoDone = true;
                parent.completedAt = Math.max(...children.map(c => c.completedAt || 0)) || Date.now();
                return 'done';

            if (!allDone) delete parent.reopened;

                return 'undone';

            return null;

                });
                const r = autoStatus(main, main.subtasks);

            });

        // ---- 備份 / 還原 ----

        function restoreFromText(text) {
            let imported;
            try { imported = JSON.parse(text); } catch (e) { alert('讀取失敗！請確認是本程式匯出的備份。'); return false; }
            if (!Array.isArray(imported)) { alert('資料格式不正確！'); return false; }
            // 匯入時重新編號，避免和現有任務 ID 重複
            const fresh = normalizeTasks(imported).map(t => ({
                ...t, id: newId(),
                subtasks: t.subtasks.map(s => ({ ...s, id: newId(), grandtasks: s.grandtasks.map(g => ({ ...g, id: newId() })) }))
            }));
            if (tasks.length > 0 && confirm('要保留原本的資料並合併匯入嗎？\n\n按「確定」合併資料\n按「取消」則完全覆蓋目前資料')) tasks = tasks.concat(fresh);
            else tasks = fresh;
            saveData();
            const c = countAll();
            showToast(`✅ 還原成功！共 ${c.mains} 個主任務、${c.subs} 個次任務、${c.grands} 個孫任務`, 3500);
            return true;
        }

        // ---- 拖曳後同步資料 ----
        // ---- 拖曳（v2.9：可以跨層級搬移） ----
        // 主任務、次任務、孫任務都在同一個拖曳群組，可以互相拖進不同層級：
        //   拖到主任務清單 → 變成主任務；拖到某主任務底下 → 變成次任務；拖到某次任務底下 → 變成孫任務
        // 最多三層：帶著子任務往下搬時，若會超過三層就不允許，並自動復原。
        function locate(id) {
            for (const m of tasks) {
                if (m.id === id) return { obj: m, level: 'main', list: tasks, main: null, sub: null };
                for (const s of m.subtasks) {
                    if (s.id === id) return { obj: s, level: 'sub', list: m.subtasks, main: m, sub: null };
                    for (const g of s.grandtasks) if (g.id === id) return { obj: g, level: 'grand', list: s.grandtasks, main: m, sub: s };
                }
            }
            return null;
        }
        // 把任務轉成指定層級；不允許（會超過三層）時回傳 null
        function convertLevel(obj, from, to) {
            const base = { id: obj.id, text: obj.text, checked: !!obj.checked, createdAt: obj.createdAt, completedAt: obj.completedAt ?? null };
            if (obj.autoDone) base.autoDone = true;
            const kids = from === 'main' ? obj.subtasks : from === 'sub' ? obj.grandtasks : [];
            if (to === 'main') {
                const subtasks = from === 'main' ? obj.subtasks
                    : kids.map(g => ({ id: g.id, text: g.text, checked: !!g.checked, collapsed: false, createdAt: g.createdAt, completedAt: g.completedAt ?? null, grandtasks: [] }));
                return { ...base, collapsed: !!obj.collapsed, subtasks };
            }
            if (to === 'sub') {
                if (from === 'main' && kids.some(s => s.grandtasks.length)) return null;   // 會變成第四層
                const grandtasks = kids.map(k => ({ id: k.id, text: k.text, checked: !!k.checked, createdAt: k.createdAt, completedAt: k.completedAt ?? null }));
                return { ...base, collapsed: !!obj.collapsed, grandtasks };
            }
            if (kids.length) return null;   // 有子任務的項目不能變成孫任務
            delete base.autoDone;
            return base;
        }
        const LEVEL_NAME = { main: '主任務', sub: '次任務', grand: '孫任務' };
        function containerInfo(el) {
            if (el.id === 'taskList') return { level: 'main', list: tasks, parent: null, main: null };
            if (el.classList.contains('subtask-container')) { const m = findMain(+el.dataset.main); return m ? { level: 'sub', list: m.subtasks, parent: m, main: m } : null; }
            if (el.classList.contains('grandtask-container')) { const sb = findSub(+el.dataset.main, +el.dataset.sub); return sb ? { level: 'grand', list: sb.grandtasks, parent: sb, main: findMain(+el.dataset.main) } : null; }
            return null;
        }
        const ITEM_SEL = '.task-card, .subtask-item, .grandtask-row';

        let undoSnapshot = null;
        function onDragEnd(evt) {
            document.body.classList.remove('dragging');
            const snapshot = JSON.stringify(tasks);
            const before = countAll();
            const fail = msg => { tasks = JSON.parse(snapshot); setTimeout(renderTasks, 0); if (msg) showToast(msg, 3500); };

            const id = +evt.item.dataset.id;
            const src = locate(id);
            const dst = containerInfo(evt.to);
            if (!src || !dst) return fail();
            // 計算放下的位置：目標容器中，排在它前面的任務有幾個
            let index = 0;
            for (const el of evt.to.children) { if (el === evt.item) break; if (el.matches(ITEM_SEL)) index++; }

            if (src.list === dst.list && evt.oldIndex === evt.newIndex) return setTimeout(renderTasks, 0);   // 沒有移動
            // 不能拖進自己底下
            if (dst.parent && (dst.parent === src.obj || dst.main === src.obj)) return fail('⚠️ 不能把任務拖進它自己底下');

            const moved = src.level === dst.level ? src.obj : convertLevel(src.obj, src.level, dst.level);
            if (!moved) return fail(dst.level === 'grand'
                ? `⚠️ 「${src.obj.text}」底下還有子任務，不能變成孫任務\n請先移走它的子任務`
                : `⚠️ 「${src.obj.text}」的次任務底下還有孫任務，搬到這裡會超過三層\n請先移走那些孫任務`);

            src.list.splice(src.list.indexOf(src.obj), 1);
            dst.list.splice(Math.min(index, dst.list.length), 0, moved);
            // 來源與目的地的上層都恢復自動判斷
            [src.main, src.sub, dst.parent, dst.main].forEach(clearReopened);
            if (dst.parent) dst.parent.collapsed = false;
            if (dst.main) dst.main.collapsed = false;

            // 保護機制：任務總數必須不變，否則復原
            const after = countAll();
            if (after.mains + after.subs + after.grands !== before.mains + before.subs + before.grands) return fail('⚠️ 拖曳時資料數量不一致，已自動復原，沒有任何任務遺失');

            if (src.level !== dst.level) {
                undoSnapshot = snapshot;
                showUndo(`已把「${moved.text}」改為${LEVEL_NAME[dst.level]}`);
            }
            setTimeout(saveData, 0);   // 等 Sortable 收尾後再重繪
        }
        function showUndo(msg) {
            let bar = document.getElementById('undoBar');
            if (!bar) {
                bar = document.createElement('div'); bar.id = 'undoBar'; bar.className = 'undo-bar';
                bar.innerHTML = '<span></span><button onclick="doUndo()">復原</button>';
                document.body.appendChild(bar);
            }
            bar.querySelector('span').textContent = msg;
            bar.classList.add('show');
            clearTimeout(bar._t); bar._t = setTimeout(() => { bar.classList.remove('show'); undoSnapshot = null; }, 6000);
        }
        function doUndo() {
            if (!undoSnapshot) return;
            tasks = JSON.parse(undoSnapshot); undoSnapshot = null;
            document.getElementById('undoBar').classList.remove('show');
            saveData(); showToast('已復原', 1500);
        }

        // ---- 新增 / 編輯 / 刪除 ----
        function addMainTask() {
            const input = document.getElementById('mainTaskInput');
            const text = input.value.trim(); if (!text) return;
            tasks.unshift({ id: newId(), text, checked: false, collapsed: false, createdAt: Date.now(), completedAt: null, subtasks: [] });
            input.value = ''; saveData();
        }
        // ---- 新增次任務 / 孫任務：預設語音，語音失敗才改用鍵盤 ----
        let listenTarget = null;   // { level: 'sub' | 'grand', mainTaskId, subTaskId }
        let listenEndAction = null; // 'keyboard' | 'cancel'：使用者手動中止時要做什麼

        function levelName(level) { return level === 'sub' ? '次任務' : '孫任務'; }
        function getParent(target) {
            if (target.level === 'sub') return findMain(target.mainTaskId);
            for (const t of tasks) { const f = t.subtasks.find(x => x.id === target.subTaskId); if (f) return f; }
            return null;
        }

        function addSubTask(mainTaskId) { startAdd({ level: 'sub', mainTaskId }); }
        function addGrandTask(mainTaskId, subTaskId) { startAdd({ level: 'grand', mainTaskId, subTaskId }); }

        async function startAdd(target) {
            const parent = getParent(target); if (!parent) return;
            // 不支援語音或離線：直接鍵盤輸入
            if (!SpeechRecognition || !navigator.onLine) { keyboardAdd(target); return; }

            listenTarget = target; listenEndAction = null;
            document.getElementById('lmTitle').textContent = `新增${levelName(target.level)}到`;
            document.getElementById('lmParent').textContent = parent.text;
            document.getElementById('listenModal').style.display = 'flex';

            let heard = '', err = null;
            try { heard = (await listenOnce('zh-TW')).trim(); } catch (e) { err = e; }
            document.getElementById('listenModal').style.display = 'none';
            const action = listenEndAction; listenTarget = null; listenEndAction = null;

            if (action === 'cancel') return;
            if (heard && action !== 'keyboard') {
                commitAdd(target, heard);   // 辨識成功：直接新增
                return;
            }
            // 語音失敗（或使用者選擇改用鍵盤）：出現鍵盤輸入框；有聽到部分內容就帶入讓使用者修改
            if (action !== 'keyboard' && err) showToast(voiceErrorText(err) + '\n請改用鍵盤輸入', 2500);
            keyboardAdd(target, heard);
        }
        function stopListen() { if (activeRec) activeRec.stop(); }          // 說完了，送出辨識
        function switchToKeyboard() { listenEndAction = 'keyboard'; if (activeRec) activeRec.abort(); }
        function cancelListen() { listenEndAction = 'cancel'; if (activeRec) activeRec.abort(); }

        function keyboardAdd(target, preset = '') {
            const parent = getParent(target); if (!parent) return;
            const text = prompt(preset ? `請確認或修改${levelName(target.level)}內容：` : `新增${levelName(target.level)}到「${parent.text}」：`, preset);
            commitAdd(target, text);
        }
        function commitAdd(target, text) {
            if (!text || !text.trim()) return;
            text = text.trim();
            // 聆聽期間可能拖曳或刪除，重新用 ID 找一次
            const parent = getParent(target);
            if (!parent) return showToast(`找不到原本的${target.level === 'sub' ? '主任務' : '次任務'}，可能已被刪除`);
            if (target.level === 'sub') {
                parent.subtasks.unshift({ id: newId(), text, checked: false, collapsed: false, createdAt: Date.now(), completedAt: null, grandtasks: [] });
                clearReopened(parent);
                parent.collapsed = false;
            } else {
                parent.grandtasks.unshift({ id: newId(), text, checked: false, createdAt: Date.now(), completedAt: null });
                clearReopened(parent);
                parent.collapsed = false;
                const main = tasks.find(t => t.subtasks.includes(parent)); if (main) main.collapsed = false;
            }
            saveData();
            showToast(`✅ 已新增${levelName(target.level)}：${text}\n（點文字可修改）`, 2200);
        }

        function editTask(id, level, parentId = null, grandParentId = null) {
            const target = getTarget(id, level, parentId, grandParentId);
            if (!target) return;
            const nt = prompt('請修改任務內容：', target.text);
            if (nt !== null && nt.trim()) { target.text = nt.trim(); saveData(); }
        }
        // 取得某項任務所在的那一層清單（主任務清單、某主任務的次任務、某次任務的孫任務）
        function getSiblingList(level, parentId, grandParentId) {
            if (level === 'main') return tasks;
            if (level === 'sub') { const p = findMain(parentId); return p ? p.subtasks : null; }
            if (level === 'grand') { const p = findSub(grandParentId, parentId); return p ? p.grandtasks : null; }
            return null;
        }
        // 打勾完成：移到同一層的最下方
        // 取消打勾：移回「未完成」區的最後面（已完成項目的上方）
        function reorderAfterCheck(list, target) {
            const idx = list.indexOf(target);
            if (idx === -1) return;
            list.splice(idx, 1);
            if (target.checked) {
                list.push(target);
            } else {
                const firstDone = list.findIndex(x => x.checked);
                if (firstDone === -1) list.push(target); else list.splice(firstDone, 0, target);
            }
        }
        // 計算某項任務底下還有幾個未完成的子任務（主任務會一起算孫任務）
        function pendingChildren(target, level) {
            let n = 0;
            if (level === 'main') target.subtasks.forEach(s => { if (!s.checked) n++; s.grandtasks.forEach(g => { if (!g.checked) n++; }); });
            else if (level === 'sub') target.grandtasks.forEach(g => { if (!g.checked) n++; });
            return n;
        }
        function childList(target, level) { return level === 'main' ? target.subtasks : level === 'sub' ? target.grandtasks : []; }

        function toggleCheck(id, level, parentId = null, grandParentId = null) {
            const target = getTarget(id, level, parentId, grandParentId);
            if (!target) return;
            const children = childList(target, level);
            if (children.length > 0) {
                const n = pendingChildren(target, level);
                const childName = level === 'main' ? '子任務' : '孫任務';
                if (!target.checked && n > 0) {
                    renderTasks();   // 把剛剛被點掉的勾選框恢復原狀
                    showToast(`⚠️ 還有 ${n} 個未完成的${childName}\n全部完成後會自動標示完成`, 3000);
                    return;
                }
            }
            target.checked = !target.checked;
            target.completedAt = target.checked ? Date.now() : null;
            delete target.autoDone;   // 手動打勾 / 取消，以使用者的選擇為準
            // 上層任務手動取消勾選（子任務都已完成）→ 保持未完成，可以繼續新增子任務
            if (children.length > 0 && !target.checked) {
                target.reopened = true;
                showToast(`已改為未完成，可以繼續新增${level === 'main' ? '次任務' : '孫任務'}`, 2500);
            } else delete target.reopened;
            // 子任務有變動 → 上層恢復自動判斷
            if (level === 'sub') clearReopened(findMain(parentId));
            if (level === 'grand') { clearReopened(findSub(grandParentId, parentId)); clearReopened(findMain(grandParentId)); }
            const list = getSiblingList(level, parentId, grandParentId);
            if (list) reorderAfterCheck(list, target);
            saveData();
        }
        function clearReopened(o) { if (o) delete o.reopened; }
        function deleteTask(id, level, parentId = null, grandParentId = null) {
            const target = getTarget(id, level, parentId, grandParentId);
            if (!target) return;
            let extra = '';
            if (level === 'main' && target.subtasks.length) extra = `\n（底下的 ${target.subtasks.length} 個次任務也會一起刪除）`;
            if (level === 'sub' && target.grandtasks.length) extra = `\n（底下的 ${target.grandtasks.length} 個孫任務也會一起刪除）`;
            if (!confirm(`確定要刪除「${target.text}」嗎？${extra}`)) return;
            if (level === 'main') tasks = tasks.filter(t => t.id !== id);
            else if (level === 'sub') { const p = findMain(parentId); if (p) { p.subtasks = p.subtasks.filter(s => s.id !== id); clearReopened(p); } }
            else if (level === 'grand') { const p = findSub(grandParentId, parentId); if (p) { p.grandtasks = p.grandtasks.filter(g => g.id !== id); clearReopened(p); clearReopened(findMain(grandParentId)); } }
            saveData();
        }

        // ---- 總覽報表 ----
        // 「工作項目」= 最底層的任務：孫任務、沒有孫任務的次任務、沒有次任務的主任務。
        // 用最底層計算，避免自動完成的上層任務被重複計算。
        let reportSort = localStorage.getItem('work_reportSort') || 'progress';
        let reportHideDone = localStorage.getItem('work_reportHideDone') === 'true';
        const DAY = 86400000;
        function startOfDay(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
        function leavesOf(main) {
            const out = [];
            if (!main.subtasks.length) { out.push({ item: main, path: '', mainId: main.id }); return out; }
            main.subtasks.forEach(s => {
                if (!s.grandtasks.length) out.push({ item: s, path: main.text, mainId: main.id });
                else s.grandtasks.forEach(g => out.push({ item: g, path: `${main.text} › ${s.text}`, mainId: main.id }));
            });
            return out;
        }
        function buildReport() {
            const now = Date.now(), today = startOfDay(now);
            const lvl = { main: [0, 0], sub: [0, 0], grand: [0, 0] };
            tasks.forEach(t => { lvl.main[1]++; if (t.checked) lvl.main[0]++;
                t.subtasks.forEach(s => { lvl.sub[1]++; if (s.checked) lvl.sub[0]++;
                    s.grandtasks.forEach(g => { lvl.grand[1]++; if (g.checked) lvl.grand[0]++; }); }); });
            const mains = tasks.map((t, i) => {
                const lv = leavesOf(t);
                const done = lv.filter(x => x.item.checked).length;
                return { id: t.id, idx: i, text: t.text, checked: t.checked, total: lv.length, done,
                         pct: lv.length ? Math.round(done / lv.length * 100) : 0, createdAt: t.createdAt || now, completedAt: t.completedAt, leaves: lv };
            });
            const leaves = mains.flatMap(m => m.leaves);
            const leafDone = leaves.filter(x => x.item.checked);
            const doneSince = from => leafDone.filter(x => x.item.completedAt && x.item.completedAt >= from).length;
            const days = [];
            for (let i = 13; i >= 0; i--) {
                const d0 = today - i * DAY, d1 = d0 + DAY;
                days.push({ ts: d0, n: leafDone.filter(x => x.item.completedAt >= d0 && x.item.completedAt < d1).length });
            }
            const oldest = leaves.filter(x => !x.item.checked)
                .sort((a, b) => (a.item.createdAt || now) - (b.item.createdAt || now)).slice(0, 5)
                .map(x => ({ ...x, days: Math.floor((now - (x.item.createdAt || now)) / DAY) }));
            return { now, today, lvl, mains, total: leaves.length, done: leafDone.length,
                     pct: leaves.length ? Math.round(leafDone.length / leaves.length * 100) : 0,
                     todayN: doneSince(today), week: doneSince(today - 6 * DAY), month: doneSince(today - 29 * DAY), days, oldest };
        }
        function fmtMD(ts) { const d = new Date(ts); return `${d.getMonth() + 1}/${d.getDate()}`; }
        function ringSvg(pct) {
            const r = 32, c = 2 * Math.PI * r, len = c * pct / 100;
            return `<svg class="rp-ring" viewBox="0 0 76 76" aria-hidden="true">
                <circle cx="38" cy="38" r="${r}" fill="none" style="stroke:var(--c-e8eaed)" stroke-width="8"/>
                <circle cx="38" cy="38" r="${r}" fill="none" style="stroke:${pct === 100 ? 'var(--c-188038)' : 'var(--c-1a73e8)'}" stroke-width="8" stroke-linecap="round"
                    stroke-dasharray="${len} ${c}" transform="rotate(-90 38 38)"/></svg>`;
        }
        function barChartSvg(days) {
            const W = 320, H = 130, top = 16, bottom = 20, left = 4, right = 4;
            const max = Math.max(1, ...days.map(d => d.n));
            const step = (W - left - right) / days.length, bw = Math.max(6, step - 6);
            const y = v => top + (H - top - bottom) * (1 - v / max);
            let g = `<line class="grid" x1="${left}" x2="${W - right}" y1="${y(max)}" y2="${y(max)}"/>`;
            g += `<text x="${W - right}" y="${y(max) - 4}" text-anchor="end">${max}</text>`;
            days.forEach((d, i) => {
                const x = left + i * step + (step - bw) / 2, yy = y(d.n), h = H - bottom - yy;
                const isToday = i === days.length - 1;
                // 4px 圓角只在頂端，底部貼齊基線
                const bar = d.n > 0
                    ? `<path class="bar${isToday ? ' today' : ''}" data-i="${i}" d="M${x},${H - bottom} V${yy + Math.min(4, h)} Q${x},${yy} ${x + Math.min(4, bw / 2)},${yy} H${x + bw - Math.min(4, bw / 2)} Q${x + bw},${yy} ${x + bw},${yy + Math.min(4, h)} V${H - bottom} Z"/>`
                    : '';
                g += `<rect class="hit" x="${left + i * step}" y="${top}" width="${step}" height="${H - top}" data-i="${i}"/>` + bar;
                if (d.n > 0 && (d.n === max || isToday)) g += `<text class="v" x="${x + bw / 2}" y="${yy - 3}" text-anchor="middle">${d.n}</text>`;
                if (i % 2 === 1 || isToday) g += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${isToday ? '今天' : fmtMD(d.ts)}</text>`;
            });
            g += `<line class="base" x1="${left}" x2="${W - right}" y1="${H - bottom}" y2="${H - bottom}"/>`;
            return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="最近 14 天每天完成的工作項目數">${g}</svg>`;
        }
        function renderReport() {
            const r = buildReport();
            const tile = (lbl, [d, t]) => `<div class="rp-tile"><div class="lbl">${lbl}</div><div class="val">${d}<small> / ${t}</small></div><div class="rp-mini"><i style="width:${t ? d / t * 100 : 0}%"></i></div></div>`;
            const sorters = {
                progress: (a, b) => (a.checked - b.checked) || (a.pct - b.pct) || (a.idx - b.idx),
                remain: (a, b) => (a.checked - b.checked) || ((b.total - b.done) - (a.total - a.done)) || (a.idx - b.idx),
                oldest: (a, b) => (a.checked - b.checked) || (a.createdAt - b.createdAt),
                order: (a, b) => a.idx - b.idx
            };
            const list = r.mains.filter(m => !(reportHideDone && m.checked)).sort(sorters[reportSort] || sorters.progress);
            const rows = list.map(m => {
                const age = Math.floor((r.now - m.createdAt) / DAY);
                const meta = m.checked
                    ? `<span class="rp-done-tag">✓ 已完成</span>${m.completedAt ? `，${fmtMD(m.completedAt)} 完成` : ''}`
                    : `剩 ${m.total - m.done} 項，已進行 ${age} 天`;
                return `<div class="rp-row" onclick="jumpToTask(${m.id})">
                    <div class="rp-row-top"><b>${escapeHtml(m.text)}</b><span>${m.done}/${m.total}（${m.pct}%）</span></div>
                    <div class="rp-bar"><i class="${m.pct === 100 ? 'full' : ''}" style="width:${m.pct}%"></i></div>
                    <div class="rp-row-meta">${meta}</div></div>`;
            }).join('') || `<div class="rp-empty">${tasks.length ? '主任務都已完成 🎉' : '還沒有任務'}</div>`;
            const oldRows = r.oldest.map(o => {
                return `<div class="rp-old" onclick="jumpToTask(${o.mainId})"><span class="days">${o.days} 天</span>
                    <span class="txt">${escapeHtml(o.item.text)}${o.path ? `<span class="path">${escapeHtml(o.path)}</span>` : ''}</span></div>`;
            }).join('') || '<div class="rp-empty">沒有未完成的工作項目 🎉</div>';
            const d = new Date(r.now);
            document.getElementById('reportSheet').innerHTML = `
                <div class="rp-head"><h3>📊 總覽報表<small>${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} 統計</small></h3><button class="rp-close" onclick="closeReport()" title="關閉">×</button></div>
                <div class="rp-card">
                    <div class="rp-hero">${ringSvg(r.pct)}
                        <div><div class="rp-hero-num">${r.pct}%</div>
                        <div class="rp-hero-sub">整體完成率<br>${r.done} / ${r.total} 個工作項目已完成</div></div></div>
                    <div class="rp-tiles">${tile('主任務', r.lvl.main)}${tile('次任務', r.lvl.sub)}${tile('孫任務', r.lvl.grand)}</div>
                </div>
                <div class="rp-card">
                    <h4>完成的工作項目</h4>
                    <div class="rp-tiles" style="margin-top:0">
                        <div class="rp-tile"><div class="lbl">今天</div><div class="val">${r.todayN}</div></div>
                        <div class="rp-tile"><div class="lbl">近 7 天</div><div class="val">${r.week}</div></div>
                        <div class="rp-tile"><div class="lbl">近 30 天</div><div class="val">${r.month}</div></div>
                    </div>
                </div>
                <div class="rp-card">
                    <h4>最近 14 天每天完成數<small>點長條看數字</small></h4>
                    <div class="rp-chart" id="rpChart">${barChartSvg(r.days)}</div>
                    <div class="rp-chart-info" id="rpChartInfo">14 天共完成 ${r.days.reduce((a, b) => a + b.n, 0)} 項</div>
                </div>
                <div class="rp-card">
                    <h4>各主任務進度<small>點一下跳到該任務</small></h4>
                    <div class="rp-tools">
                        <select onchange="setReportSort(this.value)">
                            <option value="progress" ${reportSort === 'progress' ? 'selected' : ''}>進度低 → 高</option>
                            <option value="remain" ${reportSort === 'remain' ? 'selected' : ''}>剩餘項目多 → 少</option>
                            <option value="oldest" ${reportSort === 'oldest' ? 'selected' : ''}>建立最久 → 最新</option>
                            <option value="order" ${reportSort === 'order' ? 'selected' : ''}>清單順序</option>
                        </select>
                        <label><input type="checkbox" ${reportHideDone ? 'checked' : ''} onchange="setReportHideDone(this.checked)">隱藏已完成</label>
                    </div>
                    ${rows}
                </div>
                <div class="rp-card">
                    <h4>拖最久的未完成項目<small>依建立時間</small></h4>
                    ${oldRows}
                </div>
                <div class="rp-actions"><button class="btn-primary" onclick="copyReportText()">📋 複製報表文字</button><button class="btn-outline" onclick="closeReport()">關閉</button></div>`;
            // 長條圖：點或滑過顯示當天數字
            const info = document.getElementById('rpChartInfo');
            document.querySelectorAll('#rpChart .hit').forEach(h => {
                const show = () => {
                    const i = +h.dataset.i, day = r.days[i];
                    document.querySelectorAll('#rpChart .bar').forEach(b => b.classList.toggle('active', +b.dataset.i === i));
                    info.textContent = `${i === r.days.length - 1 ? '今天' : fmtMD(day.ts)}（${'日一二三四五六'[new Date(day.ts).getDay()]}）：完成 ${day.n} 項`;
                };
                h.addEventListener('click', show); h.addEventListener('mouseenter', show);
            });
            return r;
        }
        function openReport() { renderReport(); document.getElementById('reportModal').style.display = 'flex'; document.getElementById('reportSheet').scrollTop = 0; }
        function closeReport() { document.getElementById('reportModal').style.display = 'none'; }
        function setReportSort(v) { reportSort = v; localStorage.setItem('work_reportSort', v); const st = document.getElementById('reportSheet').scrollTop; renderReport(); document.getElementById('reportSheet').scrollTop = st; }
        function setReportHideDone(v) { reportHideDone = v; localStorage.setItem('work_reportHideDone', v); const st = document.getElementById('reportSheet').scrollTop; renderReport(); document.getElementById('reportSheet').scrollTop = st; }
        function jumpToTask(id) {
            const t = findMain(id); if (!t) return;
            closeReport();
            if (t.collapsed) { t.collapsed = false; saveData(); }
            if (t.checked && isHideCompleted) showToast('這個任務已完成，目前被「隱藏已完成」隱藏了', 2500);
            const card = document.querySelector(`.task-card[data-id="${id}"]`);
            if (card) { card.scrollIntoView({ behavior: 'smooth', block: 'center' }); card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash'); }
        }
        async function copyReportText() {
            const r = buildReport(), d = new Date(r.now);
            const lines = [`📊 每日工作記錄 總覽（${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}）`,
                `整體完成率 ${r.pct}%（${r.done}/${r.total} 個工作項目）`,
                `主任務 ${r.lvl.main[0]}/${r.lvl.main[1]}、次任務 ${r.lvl.sub[0]}/${r.lvl.sub[1]}、孫任務 ${r.lvl.grand[0]}/${r.lvl.grand[1]}`,
                `完成數：今天 ${r.todayN}、近 7 天 ${r.week}、近 30 天 ${r.month}`, '', '【進行中】'];
            const open = r.mains.filter(m => !m.checked).sort((a, b) => a.pct - b.pct || a.idx - b.idx);
            open.forEach(m => lines.push(`・${m.text}：${m.done}/${m.total}（${m.pct}%），剩 ${m.total - m.done} 項`));
            if (!open.length) lines.push('・（全部完成）');
            const done = r.mains.filter(m => m.checked);
            if (done.length) { lines.push('', '【已完成】'); done.forEach(m => lines.push(`・${m.text}${m.completedAt ? `（${fmtMD(m.completedAt)}）` : ''}`)); }
            if (r.oldest.length) { lines.push('', '【拖最久的未完成項目】'); r.oldest.forEach(o => lines.push(`・${o.item.text}${o.path ? `（${o.path}）` : ''}：${o.days} 天`)); }
            const text = lines.join('\n');
            try { await navigator.clipboard.writeText(text); showToast('✅ 已複製報表文字，可以貼到 LINE 或 Email', 2500); }
            catch (e) { document.getElementById('tmTitle').textContent = '📋 報表文字'; document.getElementById('tmHint').textContent = '請長按全選後複製。';
                const ta = document.getElementById('tmTextarea'); ta.value = text; ta.readOnly = true;
                const btn = document.getElementById('tmAction'); btn.textContent = '關閉'; btn.onclick = closeTextModal;
                document.getElementById('textModal').style.display = 'flex'; }
        }

        // ---- 畫面繪製 ----
        function getTimeBadgeHtml(obj) {
            const c = formatTime(obj.createdAt), f = formatTime(obj.completedAt);
            return `<span class="time-badge">建立: ${c}${f ? ` | 完成: ${f}` : ''}</span>`;
        }
        function progressTag(list) {
            if (!list.length) return '';
            const done = list.filter(x => x.checked).length;
            return `<span class="progress-tag ${done === list.length ? 'done' : ''}">${done}/${list.length}</span>`;
        }
        function updateTodayStat() {
            const start = new Date(); start.setHours(0, 0, 0, 0);
            const s = start.getTime(); let n = 0;
            const cnt = o => { if (o.checked && o.completedAt >= s) n++; };
            tasks.forEach(t => { cnt(t); t.subtasks.forEach(x => { cnt(x); x.grandtasks.forEach(cnt); }); });
            document.getElementById('todayStat').textContent = n ? `今日完成 ${n}` : '';
        }

        function renderTasks() {
            sortableInstances.forEach(i => { try { i.destroy(); } catch (e) {} });
            sortableInstances = [];
            const container = document.getElementById('taskList');
            container.innerHTML = '';
            updateTodayStat();

            if (tasks.length === 0) {
                container.innerHTML = '<div class="empty-hint">還沒有任務，先在上方新增一個主要任務吧！<br>也可以按 🎤 用說的新增。</div>';
            }

            tasks.forEach(task => {
                const card = document.createElement('div');
                card.className = 'task-card' + (task.checked ? ' completed-card' : '');
                card.dataset.id = task.id;

                const toggle = task.subtasks.length
                    ? `<div class="toggle-icon" onclick="toggleSubtasks(${task.id}, 'main')">${task.collapsed ? '▶' : '▼'}</div>`
                    : `<div class="toggle-placeholder"></div>`;
                let html = `
                    <div class="task-row main-row">
                        <div class="drag-handle main-handle">☰</div>
                        ${toggle}
                        <input type="checkbox" class="${!task.checked && pendingChildren(task, 'main') ? 'locked' : ''}" ${task.checked ? 'checked' : ''} onchange="toggleCheck(${task.id}, 'main')" title="${!task.checked && pendingChildren(task, 'main') ? '還有未完成的子任務' : ''}">
                        <div class="task-text main-task-text ${task.checked ? 'completed' : ''}" onclick="editTask(${task.id}, 'main')" title="點一下修改文字">
                            ${escapeHtml(task.text)}${progressTag(task.subtasks)} ${getTimeBadgeHtml(task)}
                        </div>
                        <div class="row-actions">
                            <button class="action-btn btn-edit" title="編輯" onclick="editTask(${task.id}, 'main')">${ICON.edit}</button>
                            <button class="action-btn btn-delete" title="刪除" onclick="deleteTask(${task.id}, 'main')">${ICON.trash}</button>
                            <button class="action-btn btn-add-sub" title="新增次任務" onclick="addSubTask(${task.id})">${ICON.plus}</button>
                        </div>
                    </div>
                    <div class="subtask-container ${task.collapsed ? 'collapsed' : ''}" data-main="${task.id}">`;

                task.subtasks.forEach(sub => {
                    const subToggle = sub.grandtasks.length
                        ? `<div class="toggle-icon" onclick="toggleSubtasks(${sub.id}, 'sub', ${task.id})">${sub.collapsed ? '▶' : '▼'}</div>`
                        : `<div class="toggle-placeholder"></div>`;
                    html += `
                        <div class="subtask-item ${sub.checked ? 'completed-sub' : ''}" data-id="${sub.id}">
                            <div class="task-row subtask-row">
                                <div class="drag-handle sub-handle">☰</div>
                                ${subToggle}
                                <input type="checkbox" class="${!sub.checked && pendingChildren(sub, 'sub') ? 'locked' : ''}" ${sub.checked ? 'checked' : ''} onchange="toggleCheck(${sub.id}, 'sub', ${task.id})" title="${!sub.checked && pendingChildren(sub, 'sub') ? '還有未完成的孫任務' : ''}">
                                <div class="task-text sub-task-text ${sub.checked ? 'completed' : ''}" onclick="editTask(${sub.id}, 'sub', ${task.id})" title="點一下修改文字">
                                    ${escapeHtml(sub.text)}${progressTag(sub.grandtasks)} ${getTimeBadgeHtml(sub)}
                                </div>
                                <div class="row-actions">
                                    <button class="action-btn btn-edit" title="編輯" onclick="editTask(${sub.id}, 'sub', ${task.id})">${ICON.edit}</button>
                                    <button class="action-btn btn-delete" title="刪除" onclick="deleteTask(${sub.id}, 'sub', ${task.id})">${ICON.trash}</button>
                                    <button class="action-btn btn-add-sub small" title="新增孫任務" onclick="addGrandTask(${task.id}, ${sub.id})">${ICON.plus}</button>
                                </div>
                            </div>
                            <div class="grandtask-container ${sub.collapsed ? 'collapsed' : ''}" data-main="${task.id}" data-sub="${sub.id}">`;
                    sub.grandtasks.forEach(g => {
                        html += `
                                <div class="task-row grandtask-row ${g.checked ? 'completed-grand' : ''}" data-id="${g.id}">
                                    <div class="drag-handle grand-handle">☰</div>
                                    <input type="checkbox" ${g.checked ? 'checked' : ''} onchange="toggleCheck(${g.id}, 'grand', ${sub.id}, ${task.id})">
                                    <div class="task-text grand-task-text ${g.checked ? 'completed' : ''}" onclick="editTask(${g.id}, 'grand', ${sub.id}, ${task.id})" title="點一下修改文字">
                                        ${escapeHtml(g.text)} ${getTimeBadgeHtml(g)}
                                    </div>
                                    <div class="row-actions">
                                        <button class="action-btn btn-edit" title="編輯" onclick="editTask(${g.id}, 'grand', ${sub.id}, ${task.id})">${ICON.edit}</button>
                                        <button class="action-btn btn-delete" title="刪除" onclick="deleteTask(${g.id}, 'grand', ${sub.id}, ${task.id})">${ICON.trash}</button>
                                    </div>
                                </div>`;
                    });
                    html += `</div></div>`;   // 關閉 grandtask-container 與 subtask-item
                });

                html += `</div>`;
                card.innerHTML = html;
                container.appendChild(card);
            });
            initSortable();
        }

        function initSortable() {
            if (typeof Sortable === 'undefined') return;
            const common = {
                group: 'tasks', animation: 150, fallbackOnBody: true, swapThreshold: 0.65,
                emptyInsertThreshold: 12,
                onStart: () => document.body.classList.add('dragging'),
                onEnd: onDragEnd
            };
            try {
                sortableInstances.push(new Sortable(document.getElementById('taskList'), { ...common, handle: '.main-handle', draggable: '.task-card' }));
                document.querySelectorAll('.subtask-container').forEach(c => sortableInstances.push(new Sortable(c, { ...common, handle: '.sub-handle', draggable: '.subtask-item' })));
                document.querySelectorAll('.grandtask-container').forEach(c => sortableInstances.push(new Sortable(c, { ...common, handle: '.grand-handle', draggable: '.grandtask-row' })));
            } catch (e) { console.error('拖曳功能初始化失敗:', e); }
        }

        // 開啟時依子任務狀態校正上層任務（舊資料可能有「上層已勾、子任務未完成」的情況）
        (function initialAutoComplete() {
            const changes = applyAutoComplete();
            if (changes.length) {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch (e) {}
                setTimeout(() => autoCompleteToast(changes), 500);
            }
        })();
        initTimeBtn(); initToggleBtn(); renderTasks(); checkBackupReminder();

        // 從主畫面捷徑「新增任務」開啟時，直接把游標放到輸入框
        if (new URLSearchParams(location.search).get('action') === 'new') setTimeout(() => document.getElementById('mainTaskInput').focus(), 300);

        // 拖曳套件若在 App 開啟後才載入完成（例如網路較慢），補上拖曳功能
        if (typeof Sortable === 'undefined') window.addEventListener('load', () => { if (typeof Sortable !== 'undefined') renderTasks(); });

        // ---- 註冊 Service Worker（PWA：可安裝、可離線開啟） ----
        if ('serviceWorker' in navigator && location.protocol !== 'file:') {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Service Worker 註冊失敗:', err));
            });
        }
    </script>
</body>
</html>
